# skala-shop-api 애플리케이션
#
# 이 파일의 핵심은 probe 세 개다. 셋을 구분하지 않으면 배포가 조용히 망가진다. (D24)
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  namespace: skala-shop
spec:
  # ClusterIP다. 클러스터 밖에서 접근하려면 아래 Ingress나
  # kubectl port-forward를 쓴다.
  #
  # LoadBalancer로 두지 않는 이유: 클라우드에서 LB가 실제로 생성되어 비용이 붙고,
  # 로컬 클러스터에서는 EXTERNAL-IP가 영영 <pending>으로 남는다.
  type: ClusterIP
  selector:
    app: shop-api
  ports:
    - port: 80
      targetPort: 8080
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: skala-shop
  labels:
    app: shop-api
spec:
  # 2개다. 1개면 롤링 업데이트 중에 서비스가 끊기고,
  # 노드 하나가 죽으면 그대로 전면 장애다.
  replicas: 2
  selector:
    matchLabels:
      app: shop-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 파드가 Ready가 되기 전에는 옛 파드를 내리지 않는다.
      # maxUnavailable을 1로 두면 2개 중 1개가 먼저 사라져 용량이 절반이 된다.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: shop-api
    spec:
      # 쿠버네티스가 넣어주는 레거시 환경변수를 끈다.
      #
      # 켜져 있으면 같은 네임스페이스의 서비스마다 도커 링크 시절 형식의 변수를 주입한다.
      #   redis 서비스 → REDIS_PORT=tcp://10.96.208.253:6379
      #                  REDIS_SERVICE_HOST, REDIS_SERVICE_PORT ...
      #
      # 우리 설정도 REDIS_PORT라는 이름을 쓰고 있어서, 주입된 값이 그것을 덮었다.
      # 애플리케이션은 포트 자리에 "tcp://10.96.208.253:6379"를 받고 기동에 실패했다.
      #
      #   Failed to bind properties under 'spring.data.redis.port' to int
      #
      # 이름을 바꿔 피할 수도 있지만(그것도 함께 했다), 원인 자체를 없애는 편이 낫다.
      # 이 변수들은 아무도 쓰지 않는다. 서비스는 DNS 이름으로 찾는다.
      #
      # compose에서는 이 문제가 재현되지 않는다. 실제 클러스터에 올려보고 알았다.
      enableServiceLinks: false

      containers:
        - name: shop-api
          image: shop-api:1.0
          # 로컬 클러스터에서는 레지스트리에 올리지 않고 노드에 직접 로드한다.
          # Always로 두면 없는 원격 이미지를 찾다가 ImagePullBackOff에 빠진다.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: shop-api-config
            - secretRef:
                name: shop-api-secret

          # ── probe 세 개 ──
          #
          # 셋의 역할이 다르다. 하나로 뭉뜽그리면 다음 사고가 난다.
          #
          #   liveness만 있고 startup이 없으면
          #     → 기동이 느린 스프링이 준비되기 전에 실패로 판정되어
          #       재시작하고, 또 못 뜨고, 무한 재시작 루프에 빠진다
          #
          #   readiness와 liveness가 같으면
          #     → DB가 잠시 끊겼을 때 트래픽만 빼면 될 것을
          #       파드까지 재시작한다. 재시작해도 DB는 여전히 끊겨 있다

          # 기동 확인. 이게 통과할 때까지 아래 두 probe는 시작하지 않는다.
          # 30 × 2초 = 최대 60초를 기다린다. 그 안에 못 뜨면 실패로 본다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 2
            failureThreshold: 30

          # 살아 있는가. 실패하면 컨테이너를 재시작한다.
          # DB 상태를 보지 않는다. DB가 끊겼다고 애플리케이션을 재시작할 이유가 없다.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          # 트래픽을 받을 수 있는가. 실패하면 Service에서 빼기만 하고 재시작하지 않는다.
          #
          # DB 상태가 여기에 반영된다. 다만 그냥 되는 것이 아니라
          # application.yml에서 readiness 그룹에 db를 명시해야 한다.
          # 기본 그룹은 readinessState 하나뿐이라 DB가 끊겨도 Ready로 남는다.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              # requests는 스케줄러가 "이만큼은 확보해야 배치한다"고 보는 값이다.
              memory: "512Mi"
              cpu: "250m"
            limits:
              # limits를 넘으면 컨테이너가 OOMKilled된다.
              # Dockerfile의 MaxRAMPercentage=75가 이 값을 기준으로 힙을 잡는다.
              memory: "1Gi"
              # CPU limit은 일부러 두지 않았다. 걸면 스로틀링이 걸려
              # 기동이 느려지고 GC가 길어진다. 메모리와 달리 CPU는 초과해도
              # 프로세스가 죽지 않고 느려질 뿐이라 굳이 상한을 둘 이유가 적다.

          securityContext:
            # 이미지에서 비루트로 만들었지만 여기서 한 번 더 강제한다.
            # 이미지가 바뀌어도 이 선언은 남아 root 실행을 막는다.
            runAsNonRoot: true

            # UID를 여기에도 적는다. runAsNonRoot만 두면 쿠버네티스가
            # 이미지의 USER가 정말 비루트인지 확인할 방법이 없어 파드가 뜨지 않는다.
            # 이미지의 USER 10001과 같은 값이어야 한다.
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # 루트 파일시스템을 읽기 전용으로 막았으므로 임시 디렉터리를 따로 준다.
          # 없으면 내장 Tomcat이 임시 파일을 만들지 못해 기동에 실패한다.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # 종료 신호를 받고 이만큼 기다린 뒤 강제 종료한다.
      # 처리 중인 요청이 끝날 시간을 준다.
      terminationGracePeriodSeconds: 30
