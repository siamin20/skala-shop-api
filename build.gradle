/*
 * skala-shop-api 빌드 스크립트
 *
 * 구성 원칙: 과제 명세(교재 538~539p)의 플러그인·의존성을 모두 포함하고,
 * 그 위에 이 프로젝트에서 추가로 결정한 항목을 얹는다.
 * 아래 dependencies 블록은 [명세] / [추가] 두 구획으로 나누어 표시했다.
 *
 * 명세와 다르게 간 항목은 로컬 docs/05-decisions.md에 근거를 남기고,
 * 해당 줄에 결정 번호(D1~D11)를 주석으로 단다.
 */

plugins {
    id 'java'

    // 실행 가능한 jar 패키징(bootJar)과 bootRun 태스크를 제공한다.
    // 버전은 명세에 명시된 3.3.0을 그대로 쓴다.
    id 'org.springframework.boot' version '3.3.0'

    // Spring Boot BOM을 적용해 의존성 버전을 자동으로 맞춘다.
    // 덕분에 아래 dependencies에서 대부분 버전을 적지 않아도 된다.
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.sk.skala'
version = '0.0.1-SNAPSHOT'
description = 'SKALA SHOP REST API'

java {
    // D11: 명세(538p)가 지정한 Java 17을 그대로 따른다.
    //
    // toolchain으로 21을 강제하면 JDK 17만 설치된 환경에서는 컴파일 전에
    // "No matching toolchain"으로 빌드 자체가 실패한다. 채점 환경을 알 수 없으므로
    // 실행되지 않을 위험을 감수할 이유가 없다.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    // release는 sourceCompatibility보다 강하다. 바이트코드 버전을 낮출 뿐 아니라
    // JDK 18~21에서 추가된 표준 API를 컴파일 시점에 보이지 않게 만든다.
    // 그래서 JDK 21로 빌드해도 그 API를 직접 참조하는 코드를 실수로 넣을 수 없다.
    //
    // 다만 보장 범위는 여기까지다. 외부 라이브러리가 내부적으로 Java 21을 요구하거나
    // 리플렉션으로 새 API를 부르는 경우는 막지 못하므로, 실제 JDK 17 실행 검증은 별도로 한다.
    //
    // 가상 스레드는 이 제약과 무관하다. spring.threads.virtual.enabled는
    // API 호출이 아니라 런타임 속성이라, JDK 21에서 실행하면 켜지고 17에서는 무시된다.
    options.release = 17

    // 소스 인코딩을 고정한다. 지정하지 않으면 빌드 환경의 기본 인코딩을 따라가,
    // 한글 주석과 문자열 리터럴이 개발자 OS에 따라 깨질 수 있다.
    options.encoding = 'UTF-8'
}

configurations {
    compileOnly {
        // Lombok을 컴파일 시점에만 쓰고 런타임 산출물에는 넣지 않기 위한 설정이다.
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // ────────────────────────── [명세] 교재 539p 의존성 ──────────────────────────

    // JPA 기반 DB 연동. Spring Data JPA와 Hibernate를 포함한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // AOP. API 호출 로깅과 traceId 주입에 쓴다. (P5)
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Actuator. 헬스체크와 메트릭 엔드포인트를 제공하며
    // 쿠버네티스 probe와 Prometheus 수집에 연결한다. (P5~P6)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // REST API. 내장 Tomcat과 Jackson 직렬화를 포함한다.
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // @ConfigurationProperties 클래스의 메타데이터를 생성한다.
    // 덕분에 IDE가 application.yml에서 커스텀 설정을 자동완성해준다.
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Lombok. compileOnly + annotationProcessor로 선언해 빌드 산출물 jar에는 포함되지 않는다.
    // D2: 도메인 객체에는 @Setter와 @Data를 쓰지 않는다. Getter와 생성자 애노테이션만 쓴다.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트. JUnit 5, AssertJ, Mockito, MockMvc를 포함한다.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 개발과 단위 테스트용 인메모리 DB.
    // D10: 동시성 통합 테스트는 락 동작이 달라서 H2를 쓰지 않고 실제 PostgreSQL을 쓴다.
    runtimeOnly 'com.h2database:h2'

    // JWT. api는 컴파일 시점에 쓰는 인터페이스, impl과 jackson은 런타임 구현체다.
    // 셋을 나눠 선언하면 애플리케이션 코드가 구현체에 직접 의존하지 않는다.
    // D5: 토큰 생성·검증은 jjwt로 하고, 인가 규칙은 Spring Security 필터 체인에서 선언한다. (P2)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // ────────────────────────── [추가] 이 프로젝트의 결정 ──────────────────────────

    // Bean Validation. @Valid와 @NotBlank로 요청 DTO를 검증한다.
    // D3: 엔티티를 요청 본문으로 쓰지 않고 Request DTO를 따로 두기 때문에 필요하다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Swagger UI. 프론트엔드 없이 전체 API 흐름을 호출해 검증하기 위해 넣는다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // 운영 DB 드라이버. 로컬에서는 infra/compose.yaml로 띄운다. (D10)
    runtimeOnly 'org.postgresql:postgresql'

    // 스키마 마이그레이션. (D16)
    // 교재 9p가 "운영에서는 ddl-auto를 validate/none으로" 두라고 하는데,
    // validate는 테이블이 이미 있어야 통과하므로 스키마를 만들 수단이 따로 필요하다.
    // 교재는 그 수단을 다루지 않아 빈칸으로 남아 있었다.
    //
    // Flyway 10부터 DB별 지원이 모듈로 분리되어 PostgreSQL 모듈을 따로 넣는다.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // 인증·인가. P1에서는 BCrypt만 필요해 spring-security-crypto만 넣었는데,
    // starter는 자동 설정이 기본 필터 체인을 켜서 인가 규칙 없이는 모든 API가 401이 되기 때문이었다.
    // P2에서 SecurityConfig로 규칙을 선언하므로 이제 starter로 확장한다.
    // crypto 모듈은 starter에 포함되므로 따로 선언하지 않는다. (D5)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 테스트에서 @WithMockUser로 인증을 흉내 내기 위해 필요하다.
    testImplementation 'org.springframework.security:spring-security-test'

    // Gradle이 JUnit 5 테스트를 실행할 때 필요한 런처.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Redis. 선착순 이벤트의 원자 카운터 비교 대상이다. (D23)
    //
    // DB 락과 무엇이 다른지 재보려고 넣는다. Redis는 단일 스레드로 명령을 처리해서
    // DECR 하나로 원자적 감소가 된다. 락을 걸 필요가 없다는 것이 요점이다.
    //
    // 없어도 애플리케이션은 뜬다. 연결이 지연 생성이라 Redis 전략을 실제로 고를 때만
    // 접속한다. 기본 전략은 DB 쪽이라 Redis 없이도 서비스가 동작한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Testcontainers. 테스트가 실제 PostgreSQL 컨테이너를 띄워 그 위에서 돈다. (D21)
    //
    // 나머지 테스트는 H2(MODE=PostgreSQL)를 쓴다. 빠르지만 PostgreSQL 흉내일 뿐이라
    // 두 DB의 차이가 드러나지 않는다. 실제로 마이그레이션 하나가 H2에서는 통과하고
    // PostgreSQL에서는 기동조차 못 하는 상태였는데, H2만 쓰는 동안에는 아무도 몰랐다.
    //
    // 버전은 Spring Boot BOM이 관리하므로 적지 않는다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    // JUnit 4가 아니라 JUnit 5(Jupiter)로 실행한다.
    useJUnitPlatform()

    // Testcontainers가 쓰는 Docker API 버전. (D21)
    //
    // Testcontainers 1.19.8이 쓰는 docker-java 3.3.6은 기본 API 버전이 1.32인데,
    // Docker Engine 29부터 1.44 미만 요청을 거부한다. 그대로 두면 Docker가 멀쩡히
    // 떠 있는데도 "Could not find a valid Docker environment"로 실패한다.
    // 소켓 경로나 권한 문제로 오해하기 딱 좋은 메시지라 원인을 찾는 데 시간이 걸린다.
    //
    // docker-java는 시스템 프로퍼티 `api.version`을 읽는다.
    // `DOCKER_API_VERSION` 환경변수만 넣어봤을 때는 반영되지 않아 실패가 그대로 재현됐다.
    //
    // 1.44는 Docker 25(2024-01)부터 지원한다. 더 낮은 Docker를 쓰는 환경은
    // DOCKER_API_VERSION 환경변수로 덮어쓸 수 있게 열어둔다.
    systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'

    // 통합 테스트는 컨테이너 기동을 기다리므로 어느 테스트가 도는 중인지 보이게 한다.
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat 'short'
    }
}
