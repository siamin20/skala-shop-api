# skala-shop-api 애플리케이션 설정
#
# 프로파일을 local / prod 두 개로 나눈다.
#   local — H2 인메모리. 컨테이너 없이 바로 뜨므로 개발 중 재시작이 빠르다.
#   prod  — PostgreSQL. 운영과 동시성 테스트에 쓴다. (D10)
#
# 프로파일 지정: SPRING_PROFILES_ACTIVE=prod ./gradlew bootRun

spring:
  application:
    name: skala-shop-api

  # 활성 프로파일이 지정되지 않으면 local로 뜬다.
  profiles:
    default: local

  jackson:
    # null 필드를 응답 JSON에서 빼서 페이로드를 줄인다.
    default-property-inclusion: non_null
    # 날짜를 숫자 타임스탬프가 아니라 ISO-8601 문자열로 직렬화한다.
    serialization:
      write-dates-as-timestamps: false

  flyway:
    # 스키마는 db/migration의 마이그레이션이 만든다. ddl-auto는 검증만 한다. (D16)
    # 로컬에서도 켜두는 이유: 끄면 마이그레이션이 배포 전까지 한 번도 실행되지 않아,
    # 엔티티와 어긋나 있어도 아무도 모른다. 매일 기동할 때마다 돌려야 즉시 드러난다.
    enabled: true
    locations: classpath:db/migration

  jpa:
    # 뷰 렌더링까지 영속성 컨텍스트를 열어두는 기본 동작을 끈다.
    # 켜두면 트랜잭션 밖에서 지연 로딩이 일어나 커넥션을 오래 붙잡는다.
    open-in-view: false
    properties:
      hibernate:
        # 실행되는 SQL을 읽기 쉽게 포맷한다. 학습용이므로 켜둔다.
        format_sql: true
        # 컬렉션을 조회할 때 N+1을 줄이기 위해 IN 절로 묶는다.
        default_batch_fetch_size: 100

# 커스텀 설정. SignUpProperties가 이 값을 받는다.
# 회원가입 시 지급할 초기 포인트로, 교재 시나리오(530p)의 잔액에서 역산한 값이다.
# 프로모션 등으로 바뀔 수 있는 정책 값이라 코드 상수가 아니라 설정으로 둔다.
shop:
  signup:
    initial-point: ${SIGNUP_INITIAL_POINT:1000000}

springdoc:
  swagger-ui:
    # 기본 경로(/swagger-ui/index.html) 대신 짧은 주소를 쓴다.
    path: /swagger-ui.html
    # 태그와 오퍼레이션을 알파벳순으로 정렬해 문서를 읽기 쉽게 한다.
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: ${BACKEND_PORT:8080}

---
# ---------- local ----------
spring:
  config:
    activate:
      on-profile: local

  datasource:
    # 인메모리 DB. DB_CLOSE_DELAY=-1 이 없으면 마지막 커넥션이 닫힐 때 데이터가 사라진다.
    url: jdbc:h2:mem:skalashop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      # http://localhost:8080/h2-console 에서 테이블을 직접 확인할 수 있다.
      enabled: true
      path: /h2-console

  jpa:
    # 스키마를 만들지 않고 엔티티와 일치하는지 검증만 한다.
    # 어긋나면 기동이 실패하므로, 마이그레이션을 빠뜨린 채 엔티티만 고치는 실수를
    # 로컬에서 바로 잡을 수 있다. 운영과 같은 설정을 쓰는 것이 핵심이다. (D16)
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true

logging:
  level:
    # 바인딩되는 파라미터 값까지 보여준다. 쿼리를 눈으로 확인하며 공부하기 위한 설정이다.
    org.hibernate.orm.jdbc.bind: trace

---
# ---------- prod ----------
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skalashop}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:skalashop}
    password: ${DATABASE_PASSWORD:skalashop}

  jpa:
    # 운영에서는 스키마를 절대 자동으로 바꾸지 않는다.
    # validate는 엔티티와 실제 테이블이 어긋나면 기동을 실패시켜 사고를 미리 막는다.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
