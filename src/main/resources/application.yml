# skala-shop-api 애플리케이션 설정
#
# 프로파일을 local / prod 두 개로 나눈다.
#   local — H2 인메모리. 컨테이너 없이 바로 뜨므로 개발 중 재시작이 빠르다.
#   prod  — PostgreSQL. 운영과 동시성 테스트에 쓴다. (D10)
#
# 프로파일 지정: SPRING_PROFILES_ACTIVE=prod ./gradlew bootRun

spring:
  application:
    name: skala-shop-api

  # 활성 프로파일이 지정되지 않으면 local로 뜬다.
  profiles:
    default: local

  jackson:
    # null 필드를 응답 JSON에서 빼서 페이로드를 줄인다.
    default-property-inclusion: non_null
    # 날짜를 숫자 타임스탬프가 아니라 ISO-8601 문자열로 직렬화한다.
    serialization:
      write-dates-as-timestamps: false

  flyway:
    # 스키마는 db/migration의 마이그레이션이 만든다. ddl-auto는 검증만 한다. (D16)
    # 로컬에서도 켜두는 이유: 끄면 마이그레이션이 배포 전까지 한 번도 실행되지 않아,
    # 엔티티와 어긋나 있어도 아무도 모른다. 매일 기동할 때마다 돌려야 즉시 드러난다.
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      # REDIS 전략을 고를 때만 실제로 접속한다. 연결이 지연 생성이라
      # Redis가 없어도 나머지 기능은 그대로 동작한다. (D23)
      # 변수 이름에 SHOP_ 접두사를 붙인다.
      #
      # 쿠버네티스는 같은 네임스페이스의 서비스마다 <서비스이름>_PORT 형식의 환경변수를
      # 주입한다. redis라는 서비스가 있으면 REDIS_PORT가 생기고, 그 값은 포트 번호가 아니라
      # "tcp://10.96.208.253:6379"다. 우리가 REDIS_PORT를 쓰고 있었기 때문에 덮어써졌다.
      #
      # 파드 쪽에서 enableServiceLinks: false로 주입 자체를 껐지만(04-app.yaml),
      # 이름도 함께 바꿔 둔다. 설정 하나에 기대는 것보다 이름이 겹치지 않는 편이 낫다.
      host: ${SHOP_REDIS_HOST:localhost}
      port: ${SHOP_REDIS_PORT:6379}
      timeout: ${SHOP_REDIS_TIMEOUT:2s}

  transaction:
    # 트랜잭션 타임아웃. 락 대기(3s)와 재시도 총합(150ms)보다 길고
    # 아래 statement_timeout(10s)보다 짧아야 한다. 순서가 뒤집히면
    # 안쪽 방어선이 한 번도 발동하지 못한다. (D22)
    default-timeout: 5s

  jpa:
    # 뷰 렌더링까지 영속성 컨텍스트를 열어두는 기본 동작을 끈다.
    # 켜두면 트랜잭션 밖에서 지연 로딩이 일어나 커넥션을 오래 붙잡는다.
    open-in-view: false
    properties:
      hibernate:
        # 실행되는 SQL을 읽기 쉽게 포맷한다. 학습용이므로 켜둔다.
        format_sql: true
        # 컬렉션을 조회할 때 N+1을 줄이기 위해 IN 절로 묶는다.
        default_batch_fetch_size: 100

# 커스텀 설정. SignUpProperties가 이 값을 받는다.
# 회원가입 웰컴 적립금.
#
# 처음에는 1,000,000원이었다. 명세 530p 콘솔 시나리오의 잔액에서 역산한 값인데,
# 뷰티 커머스 화면에 올려놓고 보니 가입만으로 100만원을 주는 쇼핑몰은 없다.
# 3만원으로 낮췄다. 실제 신규 가입 적립금이 그 정도다.
#
# 낮춘 덕에 얻은 것도 있다. 고가 상품을 사려면 충전이 필요해져
# 잔액 부족(INSUFFICIENT_POINT)과 충전 흐름이 시연에서 자연스럽게 드러난다.
# 100만원이면 무엇을 사든 남아서 그 경로를 보여줄 수 없었다. (D29)
shop:
  signup:
    initial-point: ${SIGNUP_INITIAL_POINT:30000}

  jwt:
    # 기본값을 두지 않는다. 비어 있으면 JwtProperties가 기동을 실패시킨다.
    #
    # 예전에는 여기에 로컬 개발용 값이 박혀 있었다. 이 저장소는 공개되어 있어
    # 그 값을 누구나 읽을 수 있고, 그대로 배포되면 아무나 관리자 토큰을 위조한다.
    # 주석으로 "운영에서 바꾸세요"라고 적는 것으로는 부족하다. 잊으면 그만이다.
    #
    # 로컬 개발용 값은 아래 local 프로파일에만 둔다.
    secret: ${JWT_SECRET:}
    # 리프레시 쿠키의 Secure 속성. HTTPS로만 전송된다.
    # 기본이 true고, HTTP로 개발하는 local 프로파일에서만 false로 내린다.
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    # 짧게 두어 탈취되거나 권한이 회수됐을 때 유효한 시간을 줄인다. (D18)
    access-validity: ${JWT_ACCESS_VALIDITY:15m}
    # 재로그인 없이 유지할 기간. HttpOnly 쿠키로만 오간다.
    refresh-validity: ${JWT_REFRESH_VALIDITY:14d}

  concurrency:
    # 낙관적 락 충돌 시 총 시도 횟수(첫 시도 포함). (D22)
    #
    # 처음에 3으로 잡았다가 실측 후 5로 올렸다. 한 고객에 동시 20건을 넣고 잰 결과다.
    #
    #   시도  성공  거절   소요(ms)
    #     1     2    18        20
    #     3    19     1       191
    #     5    20     0       462
    #    10    20     0      1000
    #
    # 3회는 대부분 흡수하지만 완전하지 않았다. 5회부터 전부 성공한다.
    # 10회로 늘려도 성공률은 그대로고 지연만 늘어 얻는 것이 없다.
    max-retry-attempts: ${SHOP_MAX_RETRY_ATTEMPTS:5}
    # 첫 재시도까지의 기준 대기. 시도마다 2배가 되고 지터가 섞인다.
    # 5회 기준 최악의 대기 총합은 50+100+200+400 = 750ms로
    # 아래 트랜잭션 타임아웃(5s) 안에 넉넉히 들어온다.
    retry-backoff: ${SHOP_RETRY_BACKOFF:50ms}
    # 비관적 락 대기 한도. 실제 적용은 아래 datasource의 lock_timeout이 한다.
    # 이 값은 문서와 테스트가 참조하는 기준값이다.
    lock-timeout: ${SHOP_LOCK_TIMEOUT:3s}

  payment:
    # 카드번호 암호화 키. AES-256이라 32바이트 이상이어야 한다. (D32)
    # 기본값을 두지 않는다. 커밋된 키로 암호화하면 암호화하지 않은 것과 같다. (D26)
    encryption-key: ${PAYMENT_ENCRYPTION_KEY:}
    # 모의 카드사 주소. 실제 PG로 바꾸려면 이 값만 바꾸면 된다.
    issuer-url: ${PAYMENT_ISSUER_URL:http://localhost:8080/mock-issuer}

  reward:
    # 구매 적립률(%). (D31)
    #
    # 명세의 결제 모델은 포인트 차감이다. 그 위에 적립을 얹어
    # 실제 뷰티 커머스처럼 "쓰면 쌓이는" 흐름을 만든다.
    #
    # 5%는 국내 뷰티 커머스의 일반적인 기본 적립률에 맞춘 값이다.
    # 0으로 두면 적립하지 않고 명세 그대로 동작한다.
    rate: ${SHOP_REWARD_RATE:5}

  waiting-room:
    # 선착순 대기열. (D30)
    #
    # 기본은 꺼둔다. Redis가 없는 환경에서도 애플리케이션이 그대로 동작해야 한다.
    # 명세 559p의 단독 컨테이너 실행(H2 내장, Redis 없음)이 그런 경우다.
    enabled: ${SHOP_WAITING_ROOM:false}
    # 동시에 입장시킬 인원. 서버가 감당할 주문 처리량에 맞춘다.
    # D22 측정에서 200 동시 요청을 문제없이 처리했으므로 그 절반을 기준으로 잡았다.
    admit-count: ${SHOP_WAITING_ROOM_ADMIT:100}

  flash-sale:
    # 선착순 수량을 지키는 방법. OPTIMISTIC / PESSIMISTIC / ATOMIC_UPDATE / REDIS (D23)
    #
    # 기본은 ATOMIC_UPDATE다. 외부 의존이 없고, 네 방식을 같은 조건에서 잰 결과
    # 정확성과 처리량을 동시에 만족한 유일한 방식이었다.
    # 측정 표는 docs/04-concurrency.md에 있다.
    strategy: ${SHOP_FLASH_SALE_STRATEGY:ATOMIC_UPDATE}

  idempotency:
    # 키 보관 기간. 짧으면 늦은 재시도가 중복 실행되고, 길면 테이블이 커진다.
    # 만료 행을 지우는 배치는 P5에서 다룬다. (D20)
    validity: ${IDEMPOTENCY_VALIDITY:24h}

  admin:
    # 값이 없으면 관리자 계정을 만들지 않는다. 기본값을 두면 설정을 잊었을 때
    # 모두가 아는 비밀번호로 관리자가 생긴다.
    id: ${SHOP_ADMIN_ID:}
    password: ${SHOP_ADMIN_PASSWORD:}

# Actuator. 쿠버네티스 probe와 컨테이너 헬스체크가 이 엔드포인트를 쓴다. (D24)
management:
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. 기본값은 health와 info뿐이지만 명시해둔다.
        # env나 configprops를 열면 JWT 시크릿과 DB 비밀번호가 그대로 노출된다.
        # metrics와 prometheus를 열어 수집기가 긁어갈 수 있게 한다. (D28)
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # liveness와 readiness를 나눈다. 이게 없으면 /actuator/health 하나뿐이라
      # 쿠버네티스가 두 probe에 같은 응답을 보게 된다.
      #
      # 둘을 구분하지 않으면 기동 중이거나 DB가 잠시 끊겼을 때
      # readiness만 내려가면 될 것을 liveness까지 실패로 보고 파드를 재시작한다.
      # 재시작해도 DB는 여전히 끊겨 있으므로 무한 재시작 루프에 빠진다.
      probes:
        enabled: true
      # 상세 정보에는 DB 접속 정보 같은 것이 섞인다. 인증된 요청에만 보여준다.
      show-details: when-authorized
      group:
        readiness:
          # 기본 readiness 그룹은 readinessState 하나뿐이다.
          # 그대로 두면 "스프링이 요청을 받을 준비가 됐는가"만 보고
          # DB가 끊겨도 Ready로 남아 트래픽을 계속 받는다. 전부 500으로 실패한다.
          #
          # db를 넣어야 DB 장애 시 파드가 서비스에서 빠지고, 복구되면 자동으로 돌아온다.
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      # 기본으로 끈다. (D24)
      #
      # spring-boot-starter-data-redis를 넣으면 Redis 헬스 체크가 자동으로 붙는데,
      # 기본 선착순 전략이 ATOMIC_UPDATE라 Redis 없이도 모든 기능이 정상 동작한다.
      # 그런데도 이 지표 하나 때문에 /actuator/health가 DOWN이 된다.
      #
      # 실제로 명세 559p대로 `docker run -p 8080:8080 shop-api:1.0`을 띄웠더니
      # 모든 API가 멀쩡히 도는데 health만 DOWN이었다. 이 경로에 probe를 걸면
      # 파드가 영원히 Ready가 되지 않는다.
      #
      # 쓰지 않는 선택적 의존성이 앱 전체를 죽은 것으로 보이게 하면 안 된다.
      # REDIS 전략을 쓸 때는 MANAGEMENT_HEALTH_REDIS_ENABLED=true로 켠다.
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

  metrics:
    tags:
      # 모든 메트릭에 애플리케이션 이름을 붙인다. 여러 서비스의 메트릭이
      # 한 저장소로 모이면 이 태그가 없어 구분하지 못하는 일이 흔하다.
      application: skala-shop-api
    distribution:
      percentiles-histogram:
        # 평균만 보면 느린 요청이 묻힌다. 요청 100건 중 99건이 10ms이고
        # 1건이 3초여도 평균은 40ms다. 백분위를 봐야 그 1건이 보인다.
        http.server.requests: true
        shop.api.duration: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        shop.api.duration: 0.5, 0.95, 0.99

springdoc:
  swagger-ui:
    # 기본 경로(/swagger-ui/index.html) 대신 짧은 주소를 쓴다.
    path: /swagger-ui.html
    # 태그와 오퍼레이션을 알파벳순으로 정렬해 문서를 읽기 쉽게 한다.
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: ${BACKEND_PORT:8080}

---
# ---------- local ----------
spring:
  config:
    activate:
      on-profile: local

  datasource:
    # 인메모리 DB. DB_CLOSE_DELAY=-1 이 없으면 마지막 커넥션이 닫힐 때 데이터가 사라진다.
    url: jdbc:h2:mem:skalashop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 로컬 개발용 시크릿. 이 값이 운영에 쓰일 일은 없다.
  # local 프로파일은 H2 인메모리라 배포 대상이 아니기 때문이다.
  h2:
    console:
      # http://localhost:8080/h2-console 에서 테이블을 직접 확인할 수 있다.
      enabled: true
      path: /h2-console

  jpa:
    # 스키마를 만들지 않고 엔티티와 일치하는지 검증만 한다.
    # 어긋나면 기동이 실패하므로, 마이그레이션을 빠뜨린 채 엔티티만 고치는 실수를
    # 로컬에서 바로 잡을 수 있다. 운영과 같은 설정을 쓰는 것이 핵심이다. (D16)
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true

shop:
  payment:
    # 로컬 개발 전용 키다. local 프로파일은 H2 인메모리라 배포 대상이 아니다.
    # 운영(prod)에는 이 블록이 없으므로 키를 주지 않으면 기동에 실패한다. (D26)
    encryption-key: ${PAYMENT_ENCRYPTION_KEY:local-development-only-card-encryption-key-32b}

  waiting-room:
    # 로컬에서는 켠다. 대기열 화면을 시연하려면 실제로 동작해야 한다.
    #
    # 정원을 3으로 낮춘다. 운영 기본값 100으로 두면 사람 몇 명으로는
    # 아무도 대기 화면을 보지 못해 시연이 되지 않는다.
    enabled: ${SHOP_WAITING_ROOM:true}
    admit-count: ${SHOP_WAITING_ROOM_ADMIT:3}

  jwt:
    # 로컬 개발 전용 값이다. local 프로파일은 H2 인메모리라 배포 대상이 아니다.
    # 운영(prod)에는 이 블록이 없으므로 JWT_SECRET을 주지 않으면 기동에 실패한다.
    secret: ${JWT_SECRET:local-development-only-secret-key-change-me-in-production}
    # 로컬은 HTTP로 띄우므로 Secure를 끈다. 켜두면 브라우저가 쿠키를 보내지 않아
    # 리프레시가 동작하지 않는다.
    cookie-secure: false

logging:
  pattern:
    # traceId를 로그 패턴에 넣는다. MDC에 담긴 값을 %X{}로 꺼낸다.
    # 없으면(스케줄러, 기동 로그) 하이픈이 찍혀 자리가 비지 않는다. (D28)
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:--------}] %logger{36} - %msg%n"

  level:
    # 바인딩되는 파라미터 값까지 보여준다. 쿼리를 눈으로 확인하며 공부하기 위한 설정이다.
    org.hibernate.orm.jdbc.bind: trace

---
# ---------- prod ----------
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # DB 접속 정보에 기본값을 두지 않는다. (D26)
    #
    # 이 저장소는 공개되어 있다. 여기 skalashop/skalashop 같은 값을 적어두면
    # 그건 "예시"가 아니라 누구나 아는 자격 증명이 된다. 환경변수 설정을
    # 한 번 빠뜨리면 운영 DB가 그 값으로 뜬다.
    #
    # JWT 서명 키와 카드 암호화 키에 적용한 원칙과 같다.
    # 없으면 기동을 실패시킨다. 주석으로 "운영에서 바꾸세요"라고 적는 것으로는 부족하다.
    # 조용히 뜨고 나면 아무도 다시 확인하지 않는다.
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

    hikari:
      data-source-properties:
        # 세션 단위 타임아웃. (D22)
        #
        # 비관적 락 대기 시간을 JPA 힌트로 걸 수 없어서 여기에 둔다.
        # PostgreSQL의 FOR UPDATE에는 대기 시간을 지정하는 문법이 없다.
        # NOWAIT(0)과 SKIP LOCKED뿐이라 "3초만 기다린다"를 표현할 방법이 없다.
        #
        # lock_timeout이 없으면 인기 상품 한 행의 경합이 커넥션을 무한정 붙잡아
        # 풀이 고갈되고, 락과 무관한 API까지 함께 멈춘다.
        #
        # statement_timeout은 락과 무관한 폭주 쿼리까지 막는 바깥 방어선이다.
        options: "-c lock_timeout=${SHOP_LOCK_TIMEOUT_MS:3000} -c statement_timeout=${SHOP_STATEMENT_TIMEOUT_MS:10000}"

  jpa:
    # 운영에서는 스키마를 절대 자동으로 바꾸지 않는다.
    # validate는 엔티티와 실제 테이블이 어긋나면 기동을 실패시켜 사고를 미리 막는다.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
